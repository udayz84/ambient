<!DOCTYPE html>
<html>
<head>
<style>
  .container {
    position: relative;
    width: 400px;
    height: 400px;
    background: #111;
    overflow: hidden;
  }
  .item {
    position: absolute;
    top: 50%;
    left: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: all 0.5s;
    background: rgba(255,0,0,0.2);
  }
  .image-box {
    position: relative;
    height: 170px;
    width: 180px;
    background: green;
  }
  .label-box {
    margin-top: 16px;
    padding: 6px 16px;
    background: rgba(0,0,0,0.8);
    color: white;
    font-size: 20px;
    line-height: 28px;
    white-space: nowrap;
  }
  
  .center {
    transform: translate(calc(-50% + 0px), -50%) scale(1);
    z-index: 10;
  }
  .center .label-box {
    opacity: 0;
  }
  
  .side-right {
    transform: translate(calc(-50% + 130px), -50%) scale(0.65);
    z-index: 0;
  }
  .side-left {
    transform: translate(calc(-50% - 130px), -50%) scale(0.65);
    z-index: 0;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="item side-left">
      <div class="image-box"></div>
      <div class="label-box">GPX 64</div>
    </div>
    <div class="item center">
      <div class="image-box"></div>
      <div class="label-box">GPX 1</div>
    </div>
    <div class="item side-right">
      <div class="image-box"></div>
      <div class="label-box">GPX 5</div>
    </div>
  </div>
</body>
</html>
